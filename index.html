<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gravador WAV</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 32px auto; padding: 0 16px; line-height: 1.5; }
  select, button { font-size: 16px; padding: 8px 12px; margin: 4px 0; }
  button { cursor: pointer; }
  #rec.on { background: #d00; color: #fff; }
  #meter { height: 14px; background: #eee; border: 1px solid #999; margin: 8px 0; }
  #bar { height: 100%; width: 0; background: #2a2; }
  #bar.clip { background: #d00; }
  .row { margin: 12px 0; }
  small { color: #555; }
  #takes li { margin: 10px 0; }
  audio { display: block; margin: 4px 0; width: 100%; }
</style>
</head>
<body>
<h1>Gravador WAV</h1>
<p><small>Grava sem compressão (WAV/PCM), sem cancelamento de eco, sem redução de ruído e sem ganho automático. Tudo fica no seu navegador: nada é enviado para servidor nenhum.</small></p>

<div class="row">
  <button id="perm">1. Liberar microfone</button>
</div>
<div class="row">
  <label>Microfone:<br><select id="mic" disabled><option>(libere o microfone primeiro)</option></select></label>
</div>
<div class="row">
  <label>Formato:
    <select id="depth">
      <option value="16">WAV 16-bit</option>
      <option value="24" selected>WAV 24-bit</option>
      <option value="32">WAV 32-bit float</option>
    </select>
  </label>
  <label>Canais:
    <select id="chan">
      <option value="1" selected>Mono</option>
      <option value="2">Estéreo</option>
    </select>
  </label>
</div>
<div id="meter"><div id="bar"></div></div>
<div class="row"><small id="info">—</small></div>
<div class="row">
  <button id="rec" disabled>● Gravar</button>
  <span id="time">0:00</span>
</div>
<ol id="takes"></ol>

<script>
const $ = (id) => document.getElementById(id);
let stream, ctx, src, node, chunks = [], recording = false, t0 = 0, timer, channels = 1, rate = 48000;

// Captura PCM cru (Float32) direto do microfone
const workletCode = `
class Tap extends AudioWorkletProcessor {
  constructor() { super(); this.on = false; this.port.onmessage = (e) => { this.on = e.data; }; }
  process(inputs) {
    const ch = inputs[0];
    if (ch && ch.length) {
      let peak = 0;
      for (const c of ch) for (let i = 0; i < c.length; i++) { const v = Math.abs(c[i]); if (v > peak) peak = v; }
      if (this.on) this.port.postMessage({ data: ch.map(c => c.slice(0)), peak });
      else this.port.postMessage({ peak });
    }
    return true;
  }
}
registerProcessor('tap', Tap);`;

async function listMics(selectedId) {
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput');
  const sel = $('mic');
  sel.innerHTML = '';
  devs.forEach((d, i) => {
    const o = document.createElement('option');
    o.value = d.deviceId; o.textContent = d.label || `Microfone ${i + 1}`;
    if (d.deviceId === selectedId) o.selected = true;
    sel.appendChild(o);
  });
  sel.disabled = false;
}

async function openMic(deviceId) {
  if (recording) return;
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (ctx) await ctx.close();
  channels = +$('chan').value;
  stream = await navigator.mediaDevices.getUserMedia({
    audio: {
      deviceId: deviceId ? { exact: deviceId } : undefined,
      echoCancellation: false, noiseSuppression: false, autoGainControl: false,
      channelCount: { ideal: channels },
      sampleRate: { ideal: 48000 },
    }
  });
  const track = stream.getAudioTracks()[0];
  const s = track.getSettings();
  // Mesmo sample rate do microfone para não reamostrar
  try { ctx = new AudioContext(s.sampleRate ? { sampleRate: s.sampleRate } : {}); }
  catch { ctx = new AudioContext(); }
  rate = ctx.sampleRate;
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([workletCode], { type: 'application/javascript' })));
  src = ctx.createMediaStreamSource(stream);
  node = new AudioWorkletNode(ctx, 'tap', { channelCount: channels, channelCountMode: 'explicit', channelInterpretation: 'speakers' });
  node.port.onmessage = (e) => {
    const { data, peak } = e.data;
    const bar = $('bar');
    bar.style.width = Math.min(100, peak * 100) + '%';
    bar.className = peak >= 0.99 ? 'clip' : '';
    if (data && recording) chunks.push(data);
  };
  src.connect(node);
  // Não conecta na saída (sem retorno no fone)
  $('info').textContent = `${track.label} · ${rate} Hz · ${channels === 1 ? 'mono' : 'estéreo'} · eco/ruído/AGC: ${s.echoCancellation ? 'on' : 'off'}/${s.noiseSuppression ? 'on' : 'off'}/${s.autoGainControl ? 'on' : 'off'}`;
  $('rec').disabled = false;
  await listMics(s.deviceId);
}

function encodeWav(bufs, nch, sr, depth) {
  const len = bufs.reduce((a, b) => a + b[0].length, 0);
  const bps = depth / 8, blockAlign = nch * bps, dataSize = len * blockAlign;
  const ab = new ArrayBuffer(44 + dataSize), v = new DataView(ab);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + dataSize, true); w(8, 'WAVE');
  w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, depth === 32 ? 3 : 1, true);
  v.setUint16(22, nch, true); v.setUint32(24, sr, true); v.setUint32(28, sr * blockAlign, true);
  v.setUint16(32, blockAlign, true); v.setUint16(34, depth, true);
  w(36, 'data'); v.setUint32(40, dataSize, true);
  let o = 44;
  for (const b of bufs) {
    const n = b[0].length;
    for (let i = 0; i < n; i++) for (let c = 0; c < nch; c++) {
      let x = (b[c] || b[0])[i];
      if (depth === 32) { v.setFloat32(o, x, true); o += 4; continue; }
      x = Math.max(-1, Math.min(1, x));
      if (depth === 16) { v.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7fff, true); o += 2; }
      else { const s = Math.round(x < 0 ? x * 0x800000 : x * 0x7fffff); v.setUint8(o, s & 255); v.setUint8(o + 1, (s >> 8) & 255); v.setUint8(o + 2, (s >> 16) & 255); o += 3; }
    }
  }
  return new Blob([ab], { type: 'audio/wav' });
}

$('perm').onclick = async () => {
  try { await openMic(); } catch (e) { alert('Não consegui abrir o microfone: ' + e.message); }
};
$('mic').onchange = (e) => openMic(e.target.value).catch(err => alert(err.message));
$('chan').onchange = () => stream && openMic($('mic').value).catch(err => alert(err.message));

$('rec').onclick = async () => {
  if (!recording) {
    await ctx.resume();
    chunks = []; recording = true; node.port.postMessage(true);
    $('rec').textContent = '■ Parar'; $('rec').classList.add('on');
    $('mic').disabled = $('chan').disabled = true;
    t0 = Date.now();
    timer = setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); $('time').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }, 250);
  } else {
    recording = false; node.port.postMessage(false); clearInterval(timer);
    $('rec').textContent = '● Gravar'; $('rec').classList.remove('on');
    $('mic').disabled = $('chan').disabled = false;
    const depth = +$('depth').value;
    const blob = encodeWav(chunks, channels, rate, depth);
    const url = URL.createObjectURL(blob);
    const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
    const name = `gravacao-${stamp}.wav`;
    const secs = (chunks.reduce((a, b) => a + b[0].length, 0) / rate).toFixed(1);
    const li = document.createElement('li');
    li.innerHTML = `<b>${name}</b> · ${secs}s · ${(blob.size / 1048576).toFixed(1)} MB<audio controls src="${url}"></audio><a href="${url}" download="${name}"><button>⬇ Baixar WAV</button></a>`;
    $('takes').prepend(li);
    chunks = [];
  }
};

navigator.mediaDevices?.addEventListener?.('devicechange', () => !$('mic').disabled && listMics($('mic').value));
</script>
</body>
</html>
